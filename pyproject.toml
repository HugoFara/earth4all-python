[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "earth4all"
version = "0.1.0"
description = "A Python implementation of the Earth4All integrated assessment model"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["system dynamics", "integrated assessment", "Earth4All", "world model"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
tables = ["pandas>=1.3"]
solvers = ["scipy>=1.7"]
dev = ["pytest>=7", "matplotlib>=3.5", "scipy>=1.7", "pandas>=1.3"]
notebook = ["jupyterlab>=3", "nbclient>=0.7", "nbformat>=5.1", "matplotlib>=3.5",
            "pandas>=1.3"]

[project.scripts]
earth4all = "earth4all.__main__:main"

[project.urls]
"Ported from" = "https://github.com/worlddynamics/Earth4All.jl"
"The model" = "https://earth4all.life/the-science-rp/"

[tool.setuptools.packages.find]
include = ["earth4all*"]

[tool.setuptools.package-data]
earth4all = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
